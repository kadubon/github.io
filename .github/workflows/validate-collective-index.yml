name: Validate collective intelligence index
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/collective-intelligence-*.json'
      - 'schemas/**'
      - 'docs/collective-intelligence-coverage.md'
      - 'collective-intelligence*'
      - 'works.html'
      - 'requirements-index.txt'
      - '.github/workflows/validate-collective-index.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-index.txt
      - name: Check static sources and regeneration
        run: |
          python scripts/generate_collective_intelligence_index.py --check
          python scripts/validate_collective_intelligence_index.py
          python scripts/audit_collective_intelligence_coverage.py --check
          python scripts/validate_paper_pages.py
          python -m unittest discover -s tests -v
          python scripts/generate_agent_catalogs.py --offline
          python scripts/generate_paper_pages.py
          python scripts/generate_collective_intelligence_index.py --check
          git diff --exit-code
