name: Generate agent discovery catalogs

on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "works.html"
      - "scripts/generate_agent_catalogs.py"
      - "scripts/generate_paper_pages.py"
      - "scripts/validate_paper_pages.py"
      - "scripts/generate_collective_intelligence_index.py"
      - "scripts/validate_collective_intelligence_index.py"
      - "scripts/refresh_oss_release_snapshots.py"
      - "data/collective-intelligence-curation.json"
      - "data/collective-intelligence-evidence.json"
      - "schemas/collective-intelligence-index.schema.json"
      - "requirements-index.txt"
      - ".github/workflows/generate-agent-catalogs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: derived-content-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -r requirements-index.txt

      - name: Generate catalogs and paper pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/generate_agent_catalogs.py
          python scripts/refresh_oss_release_snapshots.py
          python scripts/generate_agent_catalogs.py --offline
          python scripts/generate_paper_pages.py --refresh-zenodo
          python scripts/validate_paper_pages.py
          python scripts/generate_collective_intelligence_index.py
          python scripts/validate_collective_intelligence_index.py
          python -m unittest discover -s tests -v

      - name: Commit derived catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-index.json research-catalog.json oss-catalog.json oss.html papers/ sitemap.xml data/zenodo-pdf-map.json data/oss-release-snapshots.json collective-intelligence-index* collective-intelligence.bib
          if ! git diff --cached --quiet; then
            git commit -m "chore(discovery): refresh agent catalogs"
            git pull --rebase origin main
            python scripts/generate_agent_catalogs.py --offline
            python scripts/generate_paper_pages.py
            python scripts/generate_collective_intelligence_index.py
            python scripts/validate_paper_pages.py
            python scripts/validate_collective_intelligence_index.py
            git add agent-index.json research-catalog.json oss-catalog.json oss.html papers/ sitemap.xml data/zenodo-pdf-map.json collective-intelligence-index* collective-intelligence.bib
            if ! git diff --cached --quiet; then git commit -m "chore(discovery): reconcile rebased sources"; fi
            git push
          fi
